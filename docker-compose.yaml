services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      postgres_url: postgresql+asyncpg://postgres:123456@postgres:5432/postgres
      redis_url: redis://redis:6379
      cache_ttl_seconds: "3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  worker:
    build: .
    command: ["python", "-m", "src.workers.cache_invalidation"]
    environment:
      postgres_url: postgresql+asyncpg://postgres:123456@postgres:5432/postgres
      redis_url: redis://redis:6379
      cache_ttl_seconds: "3600"
      cache_invalidation_poll_interval_seconds: "2"
      cache_invalidation_retry_delay_seconds: "30"
      cache_invalidation_batch_size: "20"
      cache_invalidation_lock_timeout_seconds: "60"
      cache_invalidation_max_attempts: "5"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - app-network

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - app-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

networks:
  app-network:
    driver: bridge
